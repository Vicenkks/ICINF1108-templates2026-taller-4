<!doctype html>
<html lang="es" class="h-full">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Nueva contraseña — API Demo</title>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/vanilla-sonner@0.5.2/dist/vanilla-sonner.min.css"
		/>
		<script src="https://cdn.tailwindcss.com"></script>
		<style>
			[x-cloak] {
				display: none !important;
			}
		</style>
	</head>
	<body class="h-full bg-zinc-50 font-sans antialiased text-zinc-900">
		<ol
			id="sonner-toast-container"
			position="top-right"
			duration="5000"
			max-toasts="3"
			theme="light"
		></ol>
		<main x-data="resetPassword" x-cloak class="mx-auto max-w-sm px-4 py-16">
			<h1 class="text-3xl font-semibold tracking-tight">Nueva contraseña</h1>
			<p class="mt-2 text-sm text-zinc-500">
				Elige una contraseña de entre 8 y 72 caracteres para tu cuenta.
			</p>

			<div x-show="!token" class="mt-8 space-y-4">
				<p class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
					El enlace no es válido o está incompleto.
				</p>
				<a
					href="/forgot-password.html"
					class="block w-full rounded-lg bg-zinc-900 px-4 py-2 text-center text-sm font-medium text-white transition hover:bg-zinc-700"
				>
					Solicitar un enlace nuevo
				</a>
			</div>

			<form
				x-show="token && !success"
				class="mt-8 space-y-4"
				novalidate
				@submit.prevent="submit()"
			>
				<div>
					<label for="new-password" class="mb-1 block text-sm font-medium text-zinc-700"
						>Contraseña</label
					>
					<input
						id="new-password"
						type="password"
						x-model="form.newPassword"
						autocomplete="new-password"
						:class="errors.new_password
							? 'border-red-400 focus:border-red-500 focus:ring-red-500'
							: 'border-zinc-300 focus:border-zinc-900 focus:ring-zinc-900'"
						class="w-full rounded-lg border bg-white px-3 py-2 text-sm outline-none transition focus:ring-1"
					/>
					<p
						x-show="errors.new_password"
						x-text="errors.new_password"
						class="mt-1 text-xs text-red-600"
					></p>
				</div>

				<p
					x-show="errorMessage"
					x-text="errorMessage"
					class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
				></p>

				<button
					type="submit"
					:disabled="busy"
					class="w-full rounded-lg bg-zinc-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-zinc-700 disabled:opacity-50"
					x-text="busy ? 'Guardando…' : 'Cambiar contraseña'"
				></button>
			</form>

			<div x-show="success" class="mt-8 space-y-4">
				<p class="rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800">
					Contraseña actualizada. Ya puedes iniciar sesión con la nueva.
				</p>
				<a
					href="/login.html"
					class="block w-full rounded-lg bg-zinc-900 px-4 py-2 text-center text-sm font-medium text-white transition hover:bg-zinc-700"
				>
					Iniciar sesión
				</a>
			</div>

			<p class="mt-6 text-center text-sm text-zinc-500">
				<a
					href="/login.html"
					class="font-medium text-zinc-900 underline-offset-2 hover:underline"
				>
					Volver al inicio de sesión
				</a>
			</p>
		</main>

		<script type="module" src="/js/reset-password.js"></script>
	</body>
</html>
