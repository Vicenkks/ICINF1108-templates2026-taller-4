<!doctype html>
<html lang="es" class="h-full">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Recuperar contraseña — API Demo</title>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/vanilla-sonner@0.5.2/dist/vanilla-sonner.min.css"
		/>
		<script src="https://cdn.tailwindcss.com"></script>
		<style>
			[x-cloak] {
				display: none !important;
			}
		</style>
	</head>
	<body class="h-full bg-zinc-50 font-sans antialiased text-zinc-900">
		<ol
			id="sonner-toast-container"
			position="top-right"
			duration="5000"
			max-toasts="3"
			theme="light"
		></ol>
		<main x-data="forgotPassword" x-cloak class="mx-auto max-w-sm px-4 py-16">
			<h1 class="text-3xl font-semibold tracking-tight">Recuperar contraseña</h1>
			<p class="mt-2 text-sm text-zinc-500">
				Ingresa tu correo y te enviaremos un enlace para restablecer la contraseña.
			</p>

			<form
				x-show="!sent"
				class="mt-8 space-y-4"
				novalidate
				@submit.prevent="submit()"
			>
				<div>
					<label for="email" class="mb-1 block text-sm font-medium text-zinc-700"
						>Correo electrónico</label
					>
					<input
						id="email"
						type="email"
						x-model="form.email"
						autocomplete="email"
						placeholder="juan@example.com"
						:class="errors.email
							? 'border-red-400 focus:border-red-500 focus:ring-red-500'
							: 'border-zinc-300 focus:border-zinc-900 focus:ring-zinc-900'"
						class="w-full rounded-lg border bg-white px-3 py-2 text-sm outline-none transition focus:ring-1"
					/>
					<p x-show="errors.email" x-text="errors.email" class="mt-1 text-xs text-red-600"></p>
				</div>

				<button
					type="submit"
					:disabled="busy"
					class="w-full rounded-lg bg-zinc-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-zinc-700 disabled:opacity-50"
					x-text="busy ? 'Enviando…' : 'Enviar enlace'"
				></button>
			</form>

			<div x-show="sent" class="mt-8 space-y-4">
				<p class="rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800">
					Si el correo está registrado, enviamos un enlace de recuperación.
				</p>

				<div
					x-show="resetLink"
					class="rounded-lg border border-zinc-200 bg-white p-4 shadow-sm"
				>
					<p class="text-xs font-medium uppercase tracking-wide text-zinc-500">
						Correo simulado
					</p>
					<p class="mt-2 text-sm text-zinc-600">
						En un entorno real, este enlace llegaría a tu correo:
					</p>
					<a
						:href="resetLink"
						class="mt-2 block break-all text-sm font-medium text-zinc-900 underline underline-offset-2 hover:text-zinc-700"
						x-text="resetLink"
					></a>
				</div>

				<button
					type="button"
					@click="reset()"
					class="w-full rounded-lg border border-zinc-300 px-4 py-2 text-sm font-medium text-zinc-700 transition hover:bg-zinc-100"
				>
					Usar otro correo
				</button>
			</div>

			<p class="mt-6 text-center text-sm text-zinc-500">
				<a
					href="/login.html"
					class="font-medium text-zinc-900 underline-offset-2 hover:underline"
				>
					Volver al inicio de sesión
				</a>
			</p>
		</main>

		<script type="module" src="/js/forgot-password.js"></script>
	</body>
</html>
